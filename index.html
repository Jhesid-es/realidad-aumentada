<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="data:,">
  <title>RA - Modelo 3D</title>

  <!-- A-Frame + AR.js (marcadores) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <!-- Patrón del marcador embebido (evita peticiones CORS/XHR) -->
  <script src="pattern-data.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0b0f14;
    }

    /* La escena AR (embedded) necesita que su contenedor tenga tamaño,
       si no, el canvas WebGL queda con altura 0 y la pantalla se ve negra. */
    #app {
      position: fixed;
      inset: 0;
    }

    /* El canvas debe ser transparente para que se vea el video de la cámara. */
    canvas {
      background: transparent !important;
    }

    #inicio {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(160deg, #0b0f14 0%, #14202e 100%);
      color: #e8eef5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    #inicio h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: 1px;
    }

    #inicio p {
      margin: 0 0 18px;
      font-size: 15px;
      color: #9fb2c7;
      line-height: 1.5;
      max-width: 420px;
    }

    #mini-marker {
      width: 160px;
      height: 160px;
      border-radius: 12px;
      border: 2px solid #2c3e50;
      margin-bottom: 20px;
      image-rendering: pixelated;
    }

    button {
      padding: 16px 42px;
      font-size: 20px;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      background: #2196f3;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(33, 150, 243, 0.4);
    }

    button:active {
      transform: scale(0.97);
    }

    #aviso {
      margin-top: 18px;
      min-height: 20px;
      font-size: 14px;
      color: #ffb74d;
      max-width: 420px;
    }

    /* Mensaje de estado (no bloquea la cámara) */
    #mensaje {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9000;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      white-space: nowrap;
      pointer-events: none;
      display: none;
    }
  </style>
</head>

<body>

  <!-- Pantalla de inicio / permiso de cámara -->
  <div id="inicio">
    <h1>RA · Modelo 3D</h1>
    <p>
      Imprime el marcador <b>marker.png</b> (o muéstralo en otra pantalla) y
      apúntalo con la cámara para ver el modelo 3D.
    </p>
    <img id="mini-marker" src="marker.png" alt="Marcador AR">
    <button id="btn-iniciar" onclick="iniciarAR()">📷 Iniciar cámara</button>
    <div id="aviso"></div>
  </div>

  <!-- Estado de detección -->
  <div id="mensaje">Buscando marcador...</div>

  <!-- Aquí se inyecta la escena AR -->
  <div id="app"></div>

  <script>
    var MODELO = 'modelo.glb';
    // Ajusta la orientación del modelo si aparece girado (grados en X Y Z)
    var MODELO_ROTACION = { x: 0, y: 0, z: 0 };

    function mensaje(texto) {
      var el = document.getElementById('mensaje');
      el.style.display = 'block';
      el.textContent = texto;
    }

    function aviso(texto) {
      document.getElementById('aviso').textContent = texto;
    }

    async function iniciarAR() {
      aviso('');

      if (location.protocol === 'file:') {
        aviso('⚠️ Estás abriendo index.html directamente (file://). ' +
          'La cámara y el modelo 3D no funcionan así. ' +
          'Publica la carpeta en GitHub Pages o usa un servidor local (npx serve .).');
        return;
      }

      if (!window.isSecureContext) {
        aviso('⚠️ La cámara solo funciona en HTTPS. Publica la página en GitHub Pages y abre esa URL.');
        return;
      }

      try {
        mensaje('Solicitando permiso de cámara...');

        // El navegador exige un gesto del usuario para la cámara (sobre todo iOS).
        // Se pide el permiso con este clic y luego se cierra el stream para
        // que AR.js lo vuelva a abrir sin que aparezca un segundo diálogo.
        var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        stream.getTracks().forEach(function (t) { t.stop(); });

        // Quitar pantalla de inicio: la cámara queda visible de inmediato
        document.getElementById('inicio').remove();
        mensaje('Iniciando realidad aumentada...');

        // Patrón del marcador: se usa el embebido (data: URI) para evitar CORS/XHR.
        var patternUrl = window.PATRON_MARCADOR_BASE64
          ? 'data:text/plain;base64,' + window.PATRON_MARCADOR_BASE64
          : 'marker.patt';

        // Crear escena AR con el marcador personalizado
        document.getElementById('app').innerHTML =
          '<a-scene embedded ' +
          'vr-mode-ui="enabled:false" ' +
          'renderer="antialias:true; alpha:true; precision:medium" ' +
          'arjs="sourceType:webcam; debugUIEnabled:false; trackingMethod:best">' +
          '<a-marker id="marker" type="pattern" url="' + patternUrl + '" ' +
          'smooth="true" smooth-count="10" smooth-tolerance="0.01" smooth-threshold="5">' +
          '<a-entity id="modelo" gltf-model="' + MODELO + '" position="0 0 0"></a-entity>' +
          '</a-marker>' +
          '<a-entity camera></a-entity>' +
          '</a-scene>';

        var THREE = AFRAME.THREE;

        // Cuando el video de AR arranque, avisamos que el modelo se está cargando
        var timer = setInterval(function () {
          var v = document.getElementById('arjs-video');
          if (v && v.readyState >= 2) {
            clearInterval(timer);
            mensaje('Cargando modelo 3D...');
          }
        }, 250);
        setTimeout(function () { clearInterval(timer); }, 10000);

        // Detección del marcador
        var marker = document.getElementById('marker');
        marker.addEventListener('markerFound', function () {
          mensaje('✅ Modelo detectado');
        });
        marker.addEventListener('markerLost', function () {
          mensaje('Buscando marcador...');
        });

        // Carga del modelo 3D: se centra y se ajusta sobre el marcador
        var modelo = document.getElementById('modelo');
        modelo.addEventListener('model-loaded', function () {
          var mesh = modelo.getObject3D('mesh');
          if (!mesh) return;

          modelo.setAttribute('rotation', MODELO_ROTACION);

          var box = new THREE.Box3().setFromObject(mesh);
          var size = new THREE.Vector3();
          var center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);

          var maxDim = Math.max(size.x, size.y, size.z) || 1;
          var s = 1 / maxDim;

          modelo.setAttribute('scale', { x: s, y: s, z: s });
          modelo.setAttribute('position', {
            x: -center.x * s,
            y: (size.y * s) / 2 - center.y * s,
            z: -center.z * s
          });

          mensaje('Buscando marcador...');
        });

        modelo.addEventListener('model-error', function () {
          mensaje('⚠️ No se pudo cargar el modelo 3D. Revisa que modelo.glb esté junto a index.html.');
        });

      } catch (error) {
        console.error(error);
        mensaje('❌ No se pudo acceder a la cámara. Revisa el permiso de cámara del sitio.');
      }
    }
  </script>

</body>

</html>
