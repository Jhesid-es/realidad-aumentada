<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="data:,">
  <title>RA - Modelo 3D</title>

  <!-- Igual que el ejemplo oficial: A-Frame 1.6.0 + AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0b0f14;
    }

    /* La escena AR (embedded) necesita que su contenedor tenga tamaño,
       si no, el canvas WebGL queda con altura 0 y la pantalla se ve negra. */
    #app {
      position: fixed;
      inset: 0;
    }

    /* El canvas debe ser transparente para que se vea el video de la cámara. */
    canvas {
      background: transparent !important;
    }

    #inicio {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(160deg, #0b0f14 0%, #14202e 100%);
      color: #e8eef5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    #inicio h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: 1px;
    }

    #inicio p {
      margin: 0 0 18px;
      font-size: 15px;
      color: #9fb2c7;
      line-height: 1.5;
      max-width: 420px;
    }

    #mini-marker {
      width: 160px;
      height: 160px;
      border-radius: 12px;
      border: 2px solid #2c3e50;
      margin-bottom: 20px;
      image-rendering: pixelated;
    }

    button {
      padding: 16px 42px;
      font-size: 20px;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      background: #2196f3;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(33, 150, 243, 0.4);
    }

    button:active {
      transform: scale(0.97);
    }

    #aviso {
      margin-top: 18px;
      min-height: 20px;
      font-size: 14px;
      color: #ffb74d;
      max-width: 420px;
    }

    /* Mensaje de estado (no bloquea la cámara) */
    #mensaje {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9000;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      white-space: nowrap;
      pointer-events: none;
      display: none;
    }

    /* Confirmación en pantalla de que el modelo 3D se cargó */
    #listo {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9001;
      color: #c9ffc9;
      background: rgba(0, 70, 0, 0.75);
      backdrop-filter: blur(4px);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      white-space: nowrap;
      pointer-events: none;
      display: none;
    }
  </style>
</head>

<body>

  <!-- Pantalla de inicio / permiso de cámara -->
  <div id="inicio">
    <h1>RA · Modelo 3D</h1>
    <p>
      Imprime el marcador <b>marker.png</b> (o muéstralo en otra pantalla) y
      apúntalo con la cámara para ver el modelo 3D.
    </p>
    <img id="mini-marker" src="marker.png" alt="Marcador AR">
    <button id="btn-iniciar" onclick="iniciarAR()">📷 Iniciar cámara</button>
    <div id="aviso"></div>
  </div>

  <!-- Estado de detección -->
  <div id="mensaje">Buscando marcador...</div>

  <!-- Confirmación de carga del modelo -->
  <div id="listo">✅ Modelo cargado</div>

  <!-- Aquí se inyecta la escena AR -->
  <div id="app"></div>

  <script>
    var MODELO = 'modelo.glb';

    // ===== CONFIGURACIÓN DEL MODELO EN PANTALLA =====

    // Rotación del modelo (grados en X Y Z). Útil si aparece girado.
    var MODELO_ROTACION = { x: 0, y: 0, z: 0 };

    // Dimensión: tamaño del modelo respecto al marcador.
    // 1 = ajusta el modelo al marcador automáticamente.
    // 0.5 = la mitad de tamaño · 2 = doble de tamaño.
    var MODELO_ESCALA = 2;

    // Zoom en pantalla: factor extra de tamaño sobre la escala.
    // 1 = normal · 2 = se ve el doble de grande · 0.5 = se ve a la mitad.
    var MODELO_ZOOM = 2;

    function mensaje(texto) {
      var el = document.getElementById('mensaje');
      el.style.display = 'block';
      el.textContent = texto;
    }

    function aviso(texto) {
      document.getElementById('aviso').textContent = texto;
    }

    function mostrarListo() {
      document.getElementById('listo').style.display = 'block';
    }

    function ocultarListo() {
      document.getElementById('listo').style.display = 'none';
    }

    async function iniciarAR() {
      aviso('');

      if (location.protocol === 'file:') {
        aviso('⚠️ Estás abriendo index.html directamente (file://). ' +
          'La cámara y el modelo 3D no funcionan así. ' +
          'Publica la carpeta en GitHub Pages o usa un servidor local (npx serve .).');
        return;
      }

      if (!window.isSecureContext) {
        aviso('⚠️ La cámara solo funciona en HTTPS. Publica la página en GitHub Pages y abre esa URL.');
        return;
      }

      try {
        // Quitar pantalla de inicio: la cámara queda visible de inmediato
        document.getElementById('inicio').remove();

        // Fondo transparente: evita que el fondo del html/body tape el video
        // de la cámara (comportamiento conocido en iOS con z-index negativos).
        document.documentElement.style.background = 'transparent';
        document.body.style.background = 'transparent';

        mensaje('Iniciando realidad aumentada...');

        // Escena AR mínima, igual que el ejemplo oficial, solo que con el
        // marcador personalizado. AR.js posiciona el video de la cámara solo.
        document.getElementById('app').innerHTML =
          '<a-scene embedded arjs="debugUIEnabled:false; trackingMethod:best">' +
          '<a-marker id="marker" type="pattern" url="marker.patt">' +
          '<a-entity id="modelo" gltf-model="' + MODELO + '"></a-entity>' +
          '</a-marker>' +
          '<a-entity camera></a-entity>' +
          '</a-scene>';

        var THREE = AFRAME.THREE;

        // Cuando el video de AR arranque, avisamos que el modelo se está cargando
        var modeloCargado = false;
        var timer = setInterval(function () {
          var v = document.getElementById('arjs-video');
          if (v && v.readyState >= 2) {
            clearInterval(timer);
            if (!modeloCargado) mensaje('Cargando modelo 3D...');
          }
        }, 250);
        setTimeout(function () { clearInterval(timer); }, 10000);

        // ---- Gestos táctiles: rotar (1 dedo) y zoom (pellizco) al modelo ----
        var marcadorVisible = false;
        var escalaBase = 1;          // escala automática calculada del modelo
        var zoomActual = MODELO_ZOOM; // zoom del usuario (se suma al pellizcar)
        var rotacionActual = {
          x: MODELO_ROTACION.x,
          y: MODELO_ROTACION.y,
          z: MODELO_ROTACION.z
        };
        var tamanoModelo = null;     // tamaño del modelo (se calcula al cargar)
        var centroModelo = null;     // centro del modelo (se calcula al cargar)

        var ROTAR_VELOCIDAD = 0.35;  // grados por píxel de arrastre
        var ZOOM_MIN = 0.2;
        var ZOOM_MAX = 10;

        function aplicarRotacion() {
          modelo.setAttribute('rotation', {
            x: rotacionActual.x,
            y: rotacionActual.y,
            z: rotacionActual.z
          });
        }

        // Escala + posición juntas para que el modelo siempre quede
        // centrado y apoyado sobre el marcador a cualquier zoom.
        function aplicarEscala() {
          var s = escalaBase * zoomActual;
          modelo.setAttribute('scale', { x: s, y: s, z: s });
          if (tamanoModelo && centroModelo) {
            modelo.setAttribute('position', {
              x: -centroModelo.x * s,
              y: (tamanoModelo.y * s) / 2 - centroModelo.y * s,
              z: -centroModelo.z * s
            });
          }
        }

        var gesto = { toques: {}, modo: 'ninguno', distAnterior: 0 };
        var ultimoToqueSimple = 0;

        function distToques() {
          var claves = Object.keys(gesto.toques);
          if (claves.length < 2) return 0;
          var a = gesto.toques[claves[0]], b = gesto.toques[claves[1]];
          return Math.hypot(a.x - b.x, a.y - b.y);
        }

        document.body.addEventListener('touchstart', function (e) {
          if (!marcadorVisible) return;
          e.preventDefault();
          for (var i = 0; i < e.changedTouches.length; i++) {
            var t = e.changedTouches[i];
            gesto.toques[t.identifier] = { x: t.clientX, y: t.clientY };
          }
          var n = Object.keys(gesto.toques).length;
          if (n === 1 && Date.now() - ultimoToqueSimple < 300) {
            // Doble toque: restablecer rotación y zoom al valor inicial
            rotacionActual = { x: MODELO_ROTACION.x, y: MODELO_ROTACION.y, z: MODELO_ROTACION.z };
            zoomActual = MODELO_ZOOM;
            aplicarRotacion();
            aplicarEscala();
          }
          ultimoToqueSimple = Date.now();
          if (n === 2) {
            gesto.modo = 'zoom';
            gesto.distAnterior = distToques();
          } else if (n === 1) {
            gesto.modo = 'rotar';
          }
        }, { passive: false });

        document.body.addEventListener('touchmove', function (e) {
          if (!marcadorVisible || gesto.modo === 'ninguno') return;
          e.preventDefault();
          for (var i = 0; i < e.changedTouches.length; i++) {
            var t = e.changedTouches[i];
            var prev = gesto.toques[t.identifier];
            if (!prev) continue;
            if (gesto.modo === 'rotar') {
              rotacionActual.y += (t.clientX - prev.x) * ROTAR_VELOCIDAD;
              rotacionActual.x += (t.clientY - prev.y) * ROTAR_VELOCIDAD;
              aplicarRotacion();
            }
            gesto.toques[t.identifier] = { x: t.clientX, y: t.clientY };
          }
          if (gesto.modo === 'zoom') {
            var d = distToques();
            if (gesto.distAnterior > 0) {
              zoomActual = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomActual * (d / gesto.distAnterior)));
              aplicarEscala();
            }
            gesto.distAnterior = d;
          }
        }, { passive: false });

        document.body.addEventListener('touchend', function (e) {
          for (var i = 0; i < e.changedTouches.length; i++) {
            delete gesto.toques[e.changedTouches[i].identifier];
          }
          var n = Object.keys(gesto.toques).length;
          gesto.modo = n === 2 ? 'zoom' : (n === 1 ? 'rotar' : 'ninguno');
          gesto.distAnterior = n === 2 ? distToques() : 0;
        });

        // Detección del marcador
        var marker = document.getElementById('marker');
        marker.addEventListener('markerFound', function () {
          marcadorVisible = true;
          ocultarListo();
          mensaje('✅ Modelo detectado');
        });
        marker.addEventListener('markerLost', function () {
          marcadorVisible = false;
          mensaje('Buscando marcador...');
        });

        // Carga del modelo 3D: se centra y se ajusta sobre el marcador
        var modelo = document.getElementById('modelo');
        modelo.addEventListener('model-loaded', function () {
          modeloCargado = true;
          var mesh = modelo.getObject3D('mesh');
          if (!mesh) return;

          var box = new THREE.Box3().setFromObject(mesh);
          tamanoModelo = new THREE.Vector3();
          centroModelo = new THREE.Vector3();
          box.getSize(tamanoModelo);
          box.getCenter(centroModelo);

          var maxDim = Math.max(tamanoModelo.x, tamanoModelo.y, tamanoModelo.z) || 1;
          escalaBase = (1 / maxDim) * MODELO_ESCALA;

          aplicarRotacion();
          aplicarEscala();

          mostrarListo();
          mensaje('Buscando marcador...');
        });

        modelo.addEventListener('model-error', function () {
          mensaje('⚠️ No se pudo cargar el modelo 3D. Revisa que modelo.glb esté junto a index.html.');
        });

      } catch (error) {
        console.error(error);
        mensaje('❌ No se pudo acceder a la cámara. Revisa el permiso de cámara del sitio.');
      }
    }
  </script>

</body>

</html>
